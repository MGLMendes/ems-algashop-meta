include:
  - docker-compose.tools.yaml
services:
  algashop-ordering:
    image: mglmendes/ordering:dev
    restart: no
    ports:
      - 8080:8080
    depends_on:
      algashop-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_TOMCAT_THREADS_MAX: 10
      SPRING_THREADS_VIRTUAL_ENABLED: true

  algashop-billing:
    image: mglmendes/billing:dev
    restart: no
    ports:
      - 8082:8082
    depends_on:
      algashop-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: docker

  algashop-product-catalog:
    image: mglmendes/product-catalog:dev
    restart: no
    ports:
      - 8083:8083
    depends_on:
      algashop-mongodb-1:
        condition: service_healthy
      algashop-mongodb-2:
        condition: service_started
      algashop-mongodb-3:
        condition: service_started
      algashop-redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
